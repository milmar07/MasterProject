{% block body %}
    <h1>Create Declaration</h1>
    <form action="{{ url_for('create_declaration') }}" method="POST">
        <label for="sensor_id">Sensor ID:</label>
        <input type="text" name="sensor_id" required>
        <br>
        <label for="organization_id">Organization ID:</label>
        <input type="number" name="organization_id" required>
        <br>
        <label for="declaration_type">Declaration Type:</label>
        <input type="text" name="declaration_type" required>
        <br>
        <label for="declaration_details">Declaration Details:</label>
        <input type="text" name="declaration_details">
        <br>
        <label for="timestamp">Timestamp:</label>
        <input type="number" name="timestamp" required>
        <br>
        <label for="signature">Signature:</label>
        <input type="text" name="signature" required>
        <br>
        <input type="submit" value="Create">
    </form>
{% endblock %}
