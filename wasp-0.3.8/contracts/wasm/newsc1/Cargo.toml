[package]
name = "graphoftrust"
description = "The Graph of Trust is a distributed public key infrastructure"
license = "Apache-2.0"
version = "0.1.0"
authors = ["John Doe <john@doe.org>"]
edition = "2018"
repository = "https://github.com/iotaledger/wasp"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]


[dependencies]
wasmlib = { git = "https://github.com/iotaledger/wasp", branch = "master" }
#wasmlib = { path = "/home/kuca/wasp-0.3.8/packages/wasmvm/wasmlib" }
wasm-bindgen = "0.2.63"
console_error_panic_hook = { version = "0.1.7", optional = true }
wee_alloc = { version = "0.4.5", optional = true }
curve25519-dalek = { version = "3.2.1", features = ["u64_backend"] }
#ed25519-dalek = "1.0.1"
ed25519-dalek = { version = "1.0.1", default-features = false }
base64 = "0.13.0"
digest = "0.9.0"
sha2 = "0.9.8"
hex = "0.4.3"
p256 = "0.9"
#field = { git = "https://github.com/dalek-cryptography/curve25519-dalek", branch = "main", default-features = false }
subtle = { version = "2.4.0" }
getrandom = { version = "0.2.9", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.13"
