{% block body %}
    <h1>Create Sensor</h1>
    <form method="post" action="{{ url_for('create_sensor') }}">
        <label for="sensor_id">Sensor ID:</label>
        <input type="text" name="sensor_id" id="sensor_id" required>
        <br>
        <label for="sensor_type">Sensor Type:</label>
        <input type="text" name="sensor_type" id="sensor_type" required>
        <br>
        <label for="location">Location:</label>
        <input type="text" name="location" id="location" required>
        <br>
        <label for="org_id">Organization ID:</label>
        <input type="number" name="org_id" id="org_id" required>
        <br>
        <input type="submit" value="Create Sensor">
    </form>
{% endblock %}
